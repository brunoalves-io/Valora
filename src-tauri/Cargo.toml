[package]
name = "valora"
version = "0.6.0"
description = "Valora desktop application"
authors = ["Valora"]
edition = "2021"

[lib]
name = "valora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
