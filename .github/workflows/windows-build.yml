name: Valora Windows Build

on:
  push:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release after a successful build"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag, for example v0.1.0"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest

    env:
      VITE_SUPABASE_URL: https://ezamgphhlkeqcntgvfvj.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6YbXDlis6FDcj68SILDNdw__cDelwzT
      VALORA_UPDATER_PUBLIC_KEY: ${{ vars.VALORA_UPDATER_PUBLIC_KEY }}
      VALORA_UPDATER_ENDPOINT: https://github.com/brunoalves-io/Valora/releases/latest/download/latest.json
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Valora Windows installer
        run: npm run tauri:build -- --bundles nsis

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $file = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $file) {
            throw "Valora installer was not generated."
          }
          "path=$($file.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($file.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $($file.FullName)"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Valora-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish rolling preview release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.0-preview
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
          RELEASE_ASSET: Valora_1.0.0_x64-setup.exe
        run: |
          $stableInstaller = Join-Path $env:RUNNER_TEMP $env:RELEASE_ASSET
          Copy-Item "$env:INSTALLER_PATH" "$stableInstaller" -Force

          $notes = "Latest successful Valora Windows preview build.`n`nBranch: $env:GITHUB_REF_NAME`nCommit: $env:GITHUB_SHA"

          if (gh release view "$env:RELEASE_TAG" 2>$null) {
            gh release upload "$env:RELEASE_TAG" "$stableInstaller" --clobber
            gh release edit "$env:RELEASE_TAG" --title "Valora v1.0.0-preview" --notes "$notes" --prerelease
          } else {
            gh release create "$env:RELEASE_TAG" "$stableInstaller" --title "Valora v1.0.0-preview" --notes "$notes" --prerelease
          }

      - name: Publish release branch build
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: |
          $tag = $env:GITHUB_REF_NAME.Replace("release/", "")
          if (gh release view "$tag" 2>$null) {
            gh release upload "$tag" "$env:INSTALLER_PATH" --clobber
          } else {
            gh release create "$tag" "$env:INSTALLER_PATH" --title "Valora $tag" --notes "Valora Windows preview installer." --prerelease
          }

      - name: Publish manual GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: |
          if (gh release view "$env:RELEASE_TAG" 2>$null) {
            gh release upload "$env:RELEASE_TAG" "$env:INSTALLER_PATH" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" "$env:INSTALLER_PATH" --title "Valora $env:RELEASE_TAG" --notes "Valora Windows installer."
          }
