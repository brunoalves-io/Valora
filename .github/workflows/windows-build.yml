name: Valora Windows Build

on:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release after a successful build"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag, for example v0.1.0"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest

    env:
      VITE_SUPABASE_URL: https://ezamgphhlkeqcntgvfvj.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6YbXDlis6FDcj68SILDNdw__cDelwzT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Valora Windows installer
        run: npm run tauri:build -- --bundles nsis

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $file = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $file) {
            throw "Valora installer was not generated."
          }
          "path=$($file.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($file.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $($file.FullName)"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Valora-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: |
          if (gh release view "$env:RELEASE_TAG" 2>$null) {
            gh release upload "$env:RELEASE_TAG" "$env:INSTALLER_PATH" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" "$env:INSTALLER_PATH" --title "Valora $env:RELEASE_TAG" --notes "Valora Windows installer."
          }
